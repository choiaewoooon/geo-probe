<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 가시성 모니터 · geo-probe</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="생성형 AI 답변에서 브랜드가 어떻게 등장하는지를 반복 측정해 추세로 추적하는 공개 대시보드." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0a0b'/><rect x='6' y='19' width='4' height='7' fill='%23fff' opacity='.25'/><rect x='12' y='14' width='4' height='12' fill='%23fff' opacity='.5'/><rect x='18' y='9' width='4' height='17' fill='%23fff' opacity='.75'/><rect x='24' y='6' width='2' height='20' fill='%23fff'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

<style>
/* ─────────────────────────────────────────────────────────────
   AI 가시성 모니터 — 2톤(먹/종이) 계측기 판독면
   원칙: 값은 색상이 아니라 "잉크 농도"로 말한다.
        미언급(0건)은 옅은 농도가 아니라 사선 해치로 표시한다.
        0건과 저빈도는 서로 다른 사실이기 때문이다.
   ───────────────────────────────────────────────────────────── */

/* 종이(밝은 판) — 기본 */
:root{
  --bg:#ffffff; --bg-sunk:#f6f6f7;
  --panel:#ffffff; --panel2:#f7f7f8; --panel3:#efeff1;
  --line:#e5e5e8; --line-strong:#d2d2d7;
  --tx:#0a0a0b; --dim:#5a5a64; --dim2:#8d8d97;
  --ink:#0a0a0b; --on-ink:#ffffff; --ink-rgb:10,10,11;
  --shadow:0 1px 2px rgba(10,10,11,.04), 0 8px 24px -16px rgba(10,10,11,.18);
  --shadow-lift:0 1px 2px rgba(10,10,11,.05), 0 16px 40px -22px rgba(10,10,11,.28);
  --grain:rgba(10,10,11,.045);
  --accent:var(--ink); --good:var(--ink); --warn:var(--dim); --bad:var(--dim);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo",system-ui,sans-serif;
  --r-sm:6px; --r:10px; --r-lg:14px; --r-xl:18px;
  --rail:236px;
}
/* 판(어두운 판) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090a; --bg-sunk:#0c0d0f;
    --panel:#111214; --panel2:#161719; --panel3:#1d1f22;
    --line:#232528; --line-strong:#34373c;
    --tx:#f3f3f5; --dim:#a0a0a9; --dim2:#6f6f79;
    --ink:#ffffff; --on-ink:#08090a; --ink-rgb:255,255,255;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 34px -22px rgba(0,0,0,.9);
    --shadow-lift:0 1px 0 rgba(255,255,255,.05), 0 22px 50px -26px rgba(0,0,0,1);
    --grain:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#08090a; --bg-sunk:#0c0d0f;
  --panel:#111214; --panel2:#161719; --panel3:#1d1f22;
  --line:#232528; --line-strong:#34373c;
  --tx:#f3f3f5; --dim:#a0a0a9; --dim2:#6f6f79;
  --ink:#ffffff; --on-ink:#08090a; --ink-rgb:255,255,255;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 34px -22px rgba(0,0,0,.9);
  --shadow-lift:0 1px 0 rgba(255,255,255,.05), 0 22px 50px -26px rgba(0,0,0,1);
  --grain:rgba(255,255,255,.05);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
a{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--line-strong)}
a:hover{border-bottom-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
::selection{background:var(--ink);color:var(--on-ink)}

/* ── 껍데기 ───────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.side{
  position:sticky;top:0;height:100vh;min-width:0;display:flex;flex-direction:column;
  border-right:1px solid var(--line);background:var(--bg-sunk);padding:22px 16px 16px;
}
.mark{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.mark svg{display:block;flex:none}
.mark .wm{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.14em;line-height:1.25}
.mark .wm i{display:block;font-style:normal;color:var(--dim2);font-weight:400;letter-spacing:.1em;font-size:10px}

.subject{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:11px 13px;margin-bottom:20px;box-shadow:var(--shadow);
}
.subject .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase}
.subject .nm{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.subject .rn{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-top:5px}

nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
nav .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim2);
         text-transform:uppercase;padding:16px 8px 6px}
nav .grp:first-child{padding-top:0}
nav button{
  position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:13.5px;
  padding:8px 10px;border-radius:var(--r-sm);transition:color .12s,background .12s;
}
nav button .ix{font-family:var(--mono);font-size:10px;color:var(--dim2);width:14px;flex:none}
nav button:hover{color:var(--tx);background:var(--panel3)}
nav button[aria-selected=true]{color:var(--tx);background:var(--panel);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--line)}
nav button[aria-selected=true] .ix{color:var(--tx)}
nav button[aria-selected=true]::before{
  content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:2px;background:var(--ink);border-radius:0 2px 2px 0}
nav button.local .ix::after{content:"·"}

.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-foot a{font-family:var(--mono);font-size:10.5px;color:var(--dim2);border:0;letter-spacing:.04em}
.side-foot a:hover{color:var(--tx)}
.theme{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.theme button{background:none;border:0;cursor:pointer;padding:4px 7px;color:var(--dim2);
  display:grid;place-items:center;transition:color .12s,background .12s}
.theme button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.theme svg{display:block}

.main{min-width:0;background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% -10%, var(--grain), transparent 70%)}
.inner{max-width:1080px;margin:0 auto;padding:0 34px 96px}

/* ── 상단 ─────────────────────────────────────────────────── */
.topbar{border-bottom:1px solid var(--line);margin-bottom:30px;padding:34px 0 22px;
  display:flex;gap:22px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim2);
  text-transform:uppercase;margin-bottom:9px}
.topbar h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.035em;font-weight:750}
.topbar .sub{color:var(--dim);font-size:13.5px;margin:7px 0 0;max-width:56ch}
.stamp{font-family:var(--mono);font-size:10.5px;color:var(--dim2);text-align:right;line-height:1.9;white-space:nowrap}
.stamp b{display:block;color:var(--dim);font-weight:500}

/* ── 섹션 표제 ─────────────────────────────────────────────── */
h2{display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:700;
   margin:44px 0 14px;letter-spacing:-.01em}
h2::before{content:"";width:14px;height:2px;background:var(--ink);flex:none;transform:translateY(-4px)}
h2 small{color:var(--dim2);font-weight:400;font-size:12px;letter-spacing:0}

/* ── 카드 ─────────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1120px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:15px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card .k{color:var(--dim);font-size:11.5px;margin-bottom:9px;letter-spacing:-.005em}
.card .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.03em;
         line-height:1.05;font-variant-numeric:tabular-nums;color:var(--tx)}
.card .n{color:var(--dim2);font-size:10.5px;font-family:var(--mono);margin-top:6px;letter-spacing:-.01em}
.card .gauge{height:3px;border-radius:2px;background:var(--panel3);margin-top:11px;overflow:hidden}
.card .gauge i{display:block;height:100%;background:var(--ink);border-radius:2px}
.card.flag::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg);pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--line-strong);
  background:repeating-linear-gradient(135deg,transparent 0 7px,var(--grain) 7px 8px)}

/* ── 상태 칩 ──────────────────────────────────────────────── */
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
      border-radius:999px;padding:5px 13px 5px 10px;font-size:12.5px;color:var(--dim);box-shadow:var(--shadow)}
.pill b{font-weight:650;color:var(--tx);font-size:13px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.pill.warn::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.bad::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)}

/* ── 주석 상자 ────────────────────────────────────────────── */
.note{color:var(--dim);font-size:12.5px;line-height:1.72;background:var(--panel2);
      border:1px solid var(--line);border-left:2px solid var(--line-strong);
      border-radius:0 var(--r) var(--r) 0;padding:13px 16px;margin:14px 0}
.note b{color:var(--tx);font-weight:600}
.note ul{margin:8px 0 0;padding-left:17px}.note li{margin:4px 0}

/* ── 표 ───────────────────────────────────────────────────── */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);
        background:var(--panel);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{color:var(--dim2);font-weight:500;font-size:10.5px;font-family:var(--mono);
   letter-spacing:.09em;text-transform:uppercase;background:var(--panel2);
   border-bottom:1px solid var(--line-strong);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--panel2)}
tr.me td{background:var(--panel3)}
tr.me:hover td{background:var(--panel3)}
tr.me td:first-child{font-weight:700}
tr.me td:first-child::before{content:"▸ ";color:var(--tx);font-family:var(--mono)}
.scroll table{min-width:560px}.scroll th,.scroll td{white-space:nowrap}
.scroll th:first-child,.scroll td:first-child{white-space:normal;min-width:150px}
.bar{height:6px;border-radius:3px;background:var(--ink);display:block;min-width:2px;opacity:.28}
tr.me .bar{opacity:1}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--tx)}
.sort-ind{color:var(--tx);font-size:9px}

/* ── 밀도 매트릭스 (시그니처) ─────────────────────────────── */
.plate{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
       box-shadow:var(--shadow);padding:18px;overflow-x:auto}
/* auto 레이아웃이면 첫 열이 남는 폭을 다 먹어서 칸 사이에 죽은 여백이 생긴다. */
.mx{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px;table-layout:fixed}
.mx th.rowhead,.mx td.rowhead{width:28%}
.mx th:last-child,.mx td:last-child{width:13%}
.mx th,.mx td{border:0;padding:0;background:none;position:static}
.mx thead th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim2);
  text-transform:uppercase;text-align:center;padding-bottom:6px;background:none;border:0}
.mx thead th.rowhead{text-align:left}
.mx td.rowhead{font-size:12.5px;color:var(--tx);padding-right:12px;line-height:1.35;
  white-space:normal;min-width:168px;max-width:230px}
.mx td.rowhead .qid{font-family:var(--mono);font-size:9.5px;color:var(--dim2);
  letter-spacing:.1em;display:block}
.cellwrap{position:relative;display:block;border-radius:var(--r-sm);overflow:hidden;
  height:58px;cursor:default;transition:transform .12s}
.cellwrap:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.cellwrap .fill{position:absolute;inset:0;background:var(--ink)}
.cellwrap .hatch{position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 22%,transparent) 5px 6px);
  box-shadow:inset 0 0 0 1px var(--line-strong)}
.cellwrap .txt{position:relative;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;font-family:var(--mono)}
.cellwrap .r{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1}
.cellwrap .f{font-size:9.5px;opacity:.72;letter-spacing:.02em}
.cellwrap.on-ink .txt{color:var(--on-ink)}
.cellwrap.on-bg .txt{color:var(--tx)}
.cellwrap.miss .txt{color:var(--dim)}
.cellwrap.miss .r{font-size:11.5px;font-weight:500;letter-spacing:.02em}
.cellwrap.miss .f{opacity:1;color:var(--dim2)}
.mx th:last-child,.mx td:last-child{padding-left:10px;border-left:1px solid var(--line)}
.mx tbody tr:last-child td{padding-top:10px;border-top:1px solid var(--line)}
.mx tbody tr:last-child .rowhead{color:var(--dim);font-size:11.5px}
.mx .margcell{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:58px;border-radius:var(--r-sm);border:1px dashed var(--line-strong);
  font-family:var(--mono);gap:2px;background:var(--panel2)}
.mx .margcell b{font-size:13px;font-weight:600}
.mx .margcell i{font-style:normal;font-size:9px;color:var(--dim2);letter-spacing:.06em}

.ramp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;
      padding-top:14px;border-top:1px solid var(--line);
      font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.06em}
.ramp .steps{display:flex;gap:2px;align-items:center}
.ramp .steps i{width:22px;height:11px;border-radius:2px;background:var(--ink);display:block}
.ramp .sw{width:18px;height:11px;border-radius:2px;display:inline-block;vertical-align:-1px;margin-right:5px;
  background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 22%,transparent) 5px 6px);
  box-shadow:inset 0 0 0 1px var(--line-strong)}

/* ── 브랜드 전환기 ─────────────────────────────────────────── */
.pick{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pick select{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:6px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.pick select:hover{border-color:var(--line-strong)}
.pick .hint{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim2);
  letter-spacing:.06em;margin-top:5px}

/* ── 판세 ─────────────────────────────────────────────────── */
.strip{display:inline-flex;gap:3px;vertical-align:-1px}
.strip i{width:16px;height:11px;border-radius:2px;background:var(--ink);display:block}
.strip i.miss{background:transparent;
  background-image:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--ink) 22%,transparent) 4px 5px);
  box-shadow:inset 0 0 0 1px var(--line-strong)}
.mx.field th.rowhead,.mx.field td.rowhead{width:16%}
.mx.field th:last-child,.mx.field td:last-child{width:auto;padding-left:0;border-left:0}
.mx.field td.rowhead{font-weight:600;font-size:12.5px;min-width:104px}
.mx.field tbody tr:last-child td{padding-top:0;border-top:0}
.mx.field tbody tr.on td.rowhead{position:relative}
.mx.field tbody tr.on td.rowhead::before{content:"";position:absolute;left:-6px;top:16px;bottom:16px;
  width:2px;background:var(--ink);border-radius:2px}
.mx.field .cellwrap{height:44px}
.mx.field .cellwrap .r{font-size:12.5px}
.mx.field .cellwrap.miss .r{font-size:10px}

/* ── 트리맵 ───────────────────────────────────────────────── */
.tree{position:relative;width:100%;aspect-ratio:16/7;min-height:260px;
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  background:var(--panel2);box-shadow:var(--shadow)}
.tile{position:absolute;overflow:hidden;transition:transform .14s}
.tile .box{position:absolute;inset:1.5px;border-radius:5px;background:var(--ink);
  display:flex;flex-direction:column;justify-content:flex-end;padding:9px 10px;overflow:hidden}
.tile .nm{font-size:12.5px;font-weight:650;letter-spacing:-.015em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .vl{font-family:var(--mono);font-size:10px;margin-top:2px;opacity:.75;white-space:nowrap}
.tile.on-ink .box{color:var(--on-ink)}
.tile.on-bg .box{color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.tile.me .box{box-shadow:inset 0 0 0 2px var(--panel), inset 0 0 0 3.5px var(--ink)}
.tile.tiny .vl{display:none}
.tile.tiny .nm{font-size:10.5px;font-weight:500}
.tile .own{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;padding:2px 6px;border-radius:4px;background:var(--on-ink);color:var(--ink)}
.tile:hover{z-index:3;transform:scale(1.012)}

/* ── 추세 ─────────────────────────────────────────────────── */
.chart{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
  box-shadow:var(--shadow);padding:16px 16px 10px}
.chart svg{display:block;width:100%;height:auto}

/* ── 순위 분포 (단일 스택 바) ─────────────────────────────── */
.stack{display:flex;height:38px;border-radius:var(--r-sm);overflow:hidden;
  border:1px solid var(--line);background:var(--panel2)}
.stack span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:10.5px;min-width:0;background:var(--ink);position:relative}
.stack span.miss{background:transparent;
  background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 22%,transparent) 5px 6px);
  box-shadow:inset 1px 0 0 var(--line-strong)}
.stack-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);
  font-size:10.5px;color:var(--dim2);letter-spacing:.04em}
.stack-key span{display:inline-flex;align-items:center;gap:6px}
.stack-key i{width:12px;height:12px;border-radius:3px;background:var(--ink);display:block}
.stack-key i.miss{background:transparent;
  background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 22%,transparent) 5px 6px);
  box-shadow:inset 0 0 0 1px var(--line-strong)}

/* ── 우선순위 ─────────────────────────────────────────────── */
.prio{display:flex;gap:15px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px;margin:8px 0;
  box-shadow:var(--shadow)}
.prio .rank{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--on-ink);background:var(--ink);border-radius:var(--r-sm);
  width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:1px}
.prio .body{flex:1;min-width:0}
.prio .q{font-size:14px;font-weight:650;margin-bottom:4px;letter-spacing:-.012em}
.prio .why{color:var(--dim);font-size:12.5px;line-height:1.65}
.prio .why b{color:var(--tx);font-weight:600}

/* ── 사분면 ───────────────────────────────────────────────── */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}
.quad>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow)}
.quad .qv{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em}
.quad .qk{color:var(--dim);font-size:11.5px;margin-top:2px}

/* ── 접이식 ───────────────────────────────────────────────── */
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  margin:8px 0;box-shadow:var(--shadow);overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-size:13px;list-style:none;display:flex;
  justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--panel2)}
details[open] summary{border-bottom:1px solid var(--line)}
details pre{margin:0;padding:15px 16px;font-size:11.5px;font-family:var(--mono);
  white-space:pre-wrap;color:var(--dim);max-height:340px;overflow:auto;line-height:1.7}
details.help{background:var(--panel2)}
details.help summary{color:var(--dim);font-size:13px}
details.help[open] summary{color:var(--tx);font-weight:650}
details.help p{color:var(--dim);font-size:12.5px;line-height:1.7}
details.help b{color:var(--tx);font-weight:650}
details.help .toggle::after{content:"펼치기"}
details.help[open] .toggle::after{content:"접기"}

/* ── 기타 ─────────────────────────────────────────────────── */
.tag{font-size:10px;font-family:var(--mono);color:var(--dim2);letter-spacing:.06em;
  border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.cell{font-family:var(--mono);font-size:12px}
.cell .f{color:var(--dim2)}
.empty{color:var(--dim2);font-size:13px;padding:16px 0}
.intro{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:4px}
.intro .lead{font-size:17px;line-height:1.55;color:var(--tx);font-weight:650;
  letter-spacing:-.022em;margin:0 0 14px;max-width:44ch}
.intro p{color:var(--dim);font-size:13.5px;line-height:1.75;margin:0 0 10px;max-width:66ch}
.intro .byline{color:var(--dim2);font-size:12px;margin-top:16px;font-family:var(--mono);letter-spacing:-.01em}
footer{color:var(--dim2);font-size:12px;border-top:1px solid var(--line);margin-top:56px;padding-top:22px;line-height:1.8}

/* ── 반응형 ───────────────────────────────────────────────── */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 18px}
  .mark{padding-bottom:14px}
  .subject{margin-bottom:14px}
  /* 세로 목록을 그대로 눕히면 메뉴만으로 첫 화면이 다 찬다. 한 줄로 굴린다. */
  nav{flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;
      margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav .grp{display:none}
  nav button{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--panel)}
  nav button[aria-selected=true]::before{display:none}
  nav button .ix{display:none}
  .side-foot{margin-top:14px}
  .inner{padding:0 20px 72px}
  .topbar{padding:24px 0 18px}
  .topbar h1{font-size:24px}
  .stamp{text-align:left}
  .quad{grid-template-columns:1fr}
  .tree{aspect-ratio:4/5;min-height:420px}
  .plate{padding:14px}
  .mx td.rowhead{min-width:118px;max-width:150px;font-size:12px;padding-right:8px}
  .mx{min-width:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="0" y="16" width="4" height="10" rx="1" fill="currentColor" opacity=".22"/>
        <rect x="6" y="11" width="4" height="15" rx="1" fill="currentColor" opacity=".45"/>
        <rect x="12" y="6" width="4" height="20" rx="1" fill="currentColor" opacity=".7"/>
        <rect x="18" y="0" width="4" height="26" rx="1" fill="currentColor"/>
      </svg>
      <div class="wm">GEO·PROBE<i>AI 가시성 모니터</i></div>
    </div>

    <div class="subject">
      <div class="lb">측정 대상</div>
      <div class="nm" id="brandName">—</div>
      <div class="rn" id="runStamp"></div>
      <div class="pick" id="brandPick" hidden></div>
    </div>

    <nav id="nav"></nav>

    <div class="side-foot">
      <a href="https://github.com/choiaewoooon/geo-probe" target="_blank" rel="noopener">GITHUB ↗</a>
      <div class="theme" role="group" aria-label="화면 테마">
        <button type="button" data-theme-set="light" aria-pressed="false" title="종이">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>
        </button>
        <button type="button" data-theme-set="dark" aria-pressed="false" title="판">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="inner">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="pageEyebrow">측정 결과</div>
          <h1 id="pageTitle">요약</h1>
          <p class="sub" id="pageSub"></p>
        </div>
        <div class="stamp" id="stamp"></div>
      </header>

      <div id="app"><p class="empty">데이터를 불러오는 중…</p></div>

      <footer>
        생성형 AI 답변 내 브랜드 가시성을 반복 측정하는 오픈소스 도구
        <a href="https://github.com/choiaewoooon/geo-probe" target="_blank" rel="noopener">geo-probe</a>로 수집·집계했습니다.
        측정 조건과 한계는 <a href="#" data-go="method">방법론</a>에 있습니다.
      </footer>
    </div>
  </main>

</div>

<script>
// 테마: 저장값 > 시스템. 껍데기가 먼저 칠해지도록 모듈보다 앞에 둔다.
(function(){
  var K="geoprobe-theme", v=null;
  try{ v=localStorage.getItem(K) }catch(e){}
  // ?theme=light|dark 는 저장하지 않고 이번 화면에만 적용한다(문서용 캡처·링크 공유).
  var q=new URLSearchParams(location.search).get("theme");
  if(q==="light"||q==="dark") v=q;
  if(v==="light"||v==="dark") document.documentElement.setAttribute("data-theme",v);
  function sync(){
    var cur=document.documentElement.getAttribute("data-theme");
    document.querySelectorAll("[data-theme-set]").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.themeSet===cur));
    });
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-theme-set]"); if(!b) return;
    var next=b.dataset.themeSet;
    if(document.documentElement.getAttribute("data-theme")===next){
      document.documentElement.removeAttribute("data-theme");
      try{ localStorage.removeItem(K) }catch(e){}
    }else{
      document.documentElement.setAttribute("data-theme",next);
      try{ localStorage.setItem(K,next) }catch(e){}
    }
    sync();
  });
  document.addEventListener("DOMContentLoaded",sync); sync();
})();
</script>
<script type="module" src="./app.js?v=42"></script>
</body>
</html>
