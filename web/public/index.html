<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 가시성 모니터 · geo-probe</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="생성형 AI 답변에서 브랜드가 어떻게 등장하는지를 반복 측정해 추세로 추적하는 공개 대시보드." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📡</text></svg>" />
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel2:#1a1e25; --line:#242a33;
    --tx:#e8ecf1; --dim:#98a2b3; --dim2:#6b7583;
    --accent:#4da3ff; --good:#3ecf8e; --warn:#f5a524; --bad:#f5566c;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#fff; --panel2:#f2f4f7; --line:#e3e7ed;
           --tx:#15171c; --dim:#5b6472; --dim2:#8a93a1; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
                   "Apple SD Gothic Neo",system-ui,sans-serif;
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
       word-break:keep-all;overflow-wrap:break-word}
  a{color:var(--accent)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
  header{border-bottom:1px solid var(--line);margin-bottom:28px}
  .head{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between;padding:28px 0 18px}
  h1{font-size:19px;margin:0;letter-spacing:-.025em}
  h1 .sub{color:var(--dim);font-weight:400;font-size:14px;margin-left:10px}
  .meta{color:var(--dim2);font-size:12px;font-family:var(--mono)}
  nav{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:14px}
  nav button{background:none;border:1px solid transparent;color:var(--dim);cursor:pointer;
             padding:7px 13px;border-radius:9px;font-size:13px;font-family:inherit;transition:background .12s}
  nav button:hover{color:var(--tx);background:var(--panel2)}
  nav button[aria-selected=true]{color:var(--tx);background:var(--panel);border-color:var(--line)}
  h2{font-size:15px;font-weight:600;margin:40px 0 14px;letter-spacing:-.01em}
  h2 small{color:var(--dim2);font-weight:400;font-size:12px;margin-left:8px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px}
  .card .k{color:var(--dim);font-size:12px;margin-bottom:7px}
  .card .v{font-size:25px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .card .n{color:var(--dim2);font-size:12px;font-family:var(--mono);margin-top:3px}
  .card.flag{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px}
  .pill b{font-weight:650}
  .pill.good b{color:var(--good)} .pill.warn b{color:var(--warn)} .pill.bad b{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  tr.me td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  tr.me td:first-child{font-weight:650}
  .bar{height:7px;border-radius:4px;background:var(--accent);display:block;min-width:2px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .scroll table{min-width:560px} .scroll th,.scroll td{white-space:nowrap}
  .scroll th:first-child,.scroll td:first-child{white-space:normal;min-width:150px}
  .note{color:var(--dim);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);
        border-radius:12px;padding:14px 16px;margin:14px 0}
  .note ul{margin:8px 0 0;padding-left:18px} .note li{margin:3px 0}
  .cell{font-family:var(--mono);font-size:12px}
  .cell .r{font-weight:650;font-size:13px}
  .cell.miss{color:var(--bad)}
  .cell .f{color:var(--dim2)}
  details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0}
  summary{cursor:pointer;padding:11px 15px;font-size:13px;list-style:none;display:flex;
          justify-content:space-between;gap:12px;align-items:center}
  summary::-webkit-details-marker{display:none}
  details[open] summary{border-bottom:1px solid var(--line)}
  details pre{margin:0;padding:14px 15px;font-size:12px;font-family:var(--mono);
              white-space:pre-wrap;color:var(--dim);max-height:340px;overflow:auto}
  .tag{font-size:11px;font-family:var(--mono);color:var(--dim2);
       border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:5px}
  .view{display:none} .view.on{display:block}
  .prio{display:flex;gap:12px;align-items:flex-start;background:var(--panel);
        border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0}
  .prio .rank{font-family:var(--mono);color:var(--dim2);font-size:20px;font-weight:650;line-height:1.2}
  .prio .body{flex:1}
  .prio .q{font-size:14px;font-weight:600;margin-bottom:3px}
  .prio .why{color:var(--dim);font-size:12.5px}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px}
  .quad div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .quad .qv{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
  .quad .qk{color:var(--dim);font-size:12px}
  footer{color:var(--dim2);font-size:12px;border-top:1px solid var(--line);margin-top:48px;padding-top:20px}
  .empty{color:var(--dim2);font-size:13px;padding:16px 0}
  nav button.local{opacity:.62}
  nav button.local::after{content:"로컬";font-size:10px;font-family:var(--mono);
    border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
  th[data-sort]:hover{color:var(--tx)}
  .sort-ind{color:var(--accent);font-size:10px}
  .intro{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:6px}
  .intro .lead{font-size:16.5px;line-height:1.6;color:var(--tx);font-weight:600;
               letter-spacing:-.01em;margin:0 0 14px}
  .intro p{color:var(--dim);font-size:13.5px;line-height:1.7;margin:0 0 10px}
  .intro .byline{color:var(--dim2);font-size:12.5px;margin-top:14px}
  details.help{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:0 0 18px}
  details.help summary{color:var(--dim);font-size:13px}
  details.help[open] summary{color:var(--tx);font-weight:600}
  details.help p{color:var(--dim);font-size:12.5px;line-height:1.6}
  details.help .toggle::after{content:"펼치기"}
  details.help[open] .toggle::after{content:"접기"}
  details.help b{color:var(--tx);font-weight:600}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="head">
    <h1>AI 가시성 모니터<span class="sub" id="brandName"></span></h1>
    <div class="meta" id="stamp"></div>
  </div>
  <nav id="nav"></nav>
</div></header>

<div class="wrap">
  <div id="app"><p class="empty">데이터를 불러오는 중…</p></div>
  <footer>
    생성형 AI 답변 내 브랜드 가시성을 반복 측정하는 오픈소스 도구
    <a href="https://github.com/choiaewoooon/geo-probe">geo-probe</a>로 수집·집계했습니다.
    측정 조건과 한계는 <a href="#" data-go="method">방법론</a> 참조.
  </footer>
</div>

<script type="module" src="./app.js?v=20"></script>
</body>
</html>
